  <link rel="stylesheet" href="/static/assets/vendor/@fortawesome/fontawesome-free/css/all.min.css" type="text/css">
  <!-- Page plugins -->

  <link rel="stylesheet" href="/static/assets/css/argon.css?v=1.2.0" type="text/css">

  <style>
    .sidenav-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      z-index: 1025;
    }
    #sidenav-main {
      transition: transform 0.3s ease;
      z-index: 1030;
    }
    body.sidenav-collapsed #sidenav-main {
      transform: translateX(-260px);
    }
    body.sidenav-collapsed .main-content {
      margin-left: 0 !important;
    }
    .sidenav-toggler {
      cursor: pointer;
    }
    body.sidenav-open .sidenav-backdrop {
      opacity: 1;
      visibility: visible;
    }
    @media (max-width: 991.98px) {
      body.sidenav-collapsed #sidenav-main {
        transform: translateX(-100%);
      }
      body.sidenav-open #sidenav-main {
        transform: translateX(0);
      }
      body.sidenav-open .main-content {
        margin-left: 0 !important;
      }
    }
  </style>
  <!-- Specific CSS goes HERE -->
  {% block stylesheets %}{% endblock stylesheets %}

</head>

<body class="sidenav-collapsed">

  {% include "includes/sidenav.html" %}
  <div class="sidenav-backdrop d-lg-none"></div>

  <div class="main-content" id="panel">

    {% include "includes/navigation.html" %}

    {% block content %}{% endblock content %}

  </div>

  {% include "includes/scripts.html" %}

  <script>
    (function initResponsiveSidenav() {
      const body = document.body;
      const sidenav = document.getElementById('sidenav-main');
      if (!body || !sidenav) { return; }
      const backdrop = document.querySelector('.sidenav-backdrop');
      const toggler = document.querySelector('[data-action="sidenav-pin"]');
      const BREAKPOINT = 992;
      let touchStartX = null;
      let userPinned = false;

      function isMobile() {
        return window.innerWidth < BREAKPOINT;
      }

      function closeSidenav(manual = false) {
        if (manual) { userPinned = true; }
        body.classList.add('sidenav-collapsed');
        if (isMobile()) {
          body.classList.remove('sidenav-open');
        }
      }

      function openSidenav(manual = false) {
        if (manual) { userPinned = true; }
        body.classList.remove('sidenav-collapsed');
        if (isMobile()) {
          body.classList.add('sidenav-open');
        } else {
          body.classList.remove('sidenav-open');
        }
      }

      function toggleSidenav() {
        if (body.classList.contains('sidenav-collapsed')) {
          openSidenav(true);
        } else {
          closeSidenav(true);
        }
      }

      function syncState() {
        if (isMobile()) {
          if (!body.classList.contains('sidenav-open') && !body.classList.contains('sidenav-collapsed')) {
            body.classList.add('sidenav-collapsed');
          }
        } else {
          body.classList.remove('sidenav-open');
          if (!userPinned) {
            body.classList.remove('sidenav-collapsed');
          }
        }
      }

      syncState();
      window.addEventListener('resize', syncState);

      if (toggler) {
        toggler.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          toggleSidenav();
        });
      }

      if (backdrop) {
        backdrop.addEventListener('click', function () { closeSidenav(); });
      }

      document.addEventListener('click', function (event) {
        if (isMobile() && body.classList.contains('sidenav-open')) {
          const clickedInside = sidenav.contains(event.target) || (toggler && toggler.contains(event.target));
          if (!clickedInside) {
            closeSidenav();
          }
        }
      });

      document.addEventListener('touchstart', function (event) {
        if (!isMobile() || event.touches.length !== 1) { return; }
        touchStartX = event.touches[0].clientX;
      }, { passive: true });

      document.addEventListener('touchend', function (event) {
        if (!isMobile() || touchStartX === null) { return; }
        const touchEndX = event.changedTouches[0].clientX;
        const deltaX = touchEndX - touchStartX;
        if (Math.abs(deltaX) > 60) {
          if (deltaX < 0 && body.classList.contains('sidenav-open')) {
            closeSidenav();
          } else if (deltaX > 0 && body.classList.contains('sidenav-collapsed') && touchStartX < 40) {
            openSidenav(true);
          }
        }
        touchStartX = null;
      }, { passive: true });
    })();
  </script>
  <!-- Specific JS goes HERE --> 
  {% block javascripts %}{% endblock javascripts %}

  <script src="/static/assets/js/argon.js?v=1.2.0"></script>

</body>

</html>
