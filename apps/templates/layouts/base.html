    <style>
    .sidenav-backdrop {
      position: fixed;
      inset: 0;

      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      z-index: 1025;
    }
    #sidenav-main {
      transition: transform 0.3s ease;
      z-index: 1030;
    }
    .sidenav-toggle-tab {
      position: fixed;
      top: 50%;
      left: 0;
      transform: translate(-50%, -50%);
      background: #5e72e4;
      color: #fff;
      border: none;
      border-radius: 0 8px 8px 0;
      padding: 10px 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1035;
    }
    .sidenav-toggle-tab i {
      font-size: 18px;
      line-height: 1;
    }
    body.sidenav-collapsed .sidenav-toggle-tab {
      opacity: 1;
      pointer-events: auto;
      transform: translate(0, -50%);
    }
    body.sidenav-open .sidenav-toggle-tab {
      opacity: 0;
      pointer-events: none;
    }
    body.sidenav-collapsed #sidenav-main {
      transform: translateX(-260px);
    }
    body.sidenav-collapsed .main-content {
      margin-left: 0 !important;
    }

      cursor: pointer;
    }
    body.sidenav-open .sidenav-backdrop {
      opacity: 1;
      visibility: visible;
    }
    @media (max-width: 991.98px) {
      .sidenav-toggle-tab {
        display: none;
      }
      body.sidenav-collapsed #sidenav-main {
        transform: translateX(-100%);
      }
      body.sidenav-open #sidenav-main {
        transform: translateX(0);
      }
      body.sidenav-open .main-content {
        margin-left: 0 !important;
      }
    }
  </style>

  <script>
    (function initResponsiveSidenav() {
      const body = document.body;
      const sidenav = document.getElementById('sidenav-main');
      if (!body || !sidenav) { return; }
      const backdrop = document.querySelector('.sidenav-backdrop');
      const toggler = document.querySelector('[data-action="sidenav-pin"]');
      const tab = document.getElementById('sidenav-tab');
      const BREAKPOINT = 992;
      let touchStartX = null;
      let userPinned = false;

      function isMobile() {
        return window.innerWidth < BREAKPOINT;
      }

      function updateTab() {
        if (!tab) { return; }
        const visible = !isMobile() && body.classList.contains('sidenav-collapsed');
        tab.setAttribute('aria-hidden', visible ? 'false' : 'true');
      }

      function closeSidenav(manual = false) {
        if (manual) { userPinned = true; }
        body.classList.add('sidenav-collapsed');
        body.classList.remove('sidenav-open');
        updateTab();
      }

      function openSidenav(manual = false) {
        if (manual) { userPinned = true; }
        body.classList.remove('sidenav-collapsed');
        if (isMobile()) {
          body.classList.add('sidenav-open');
        } else {
          body.classList.remove('sidenav-open');
        }
        updateTab();
      }

      function toggleSidenav() {
        if (body.classList.contains('sidenav-collapsed')) {
          openSidenav(true);
        } else {
          closeSidenav(true);
        }
      }

      function syncState() {
        if (isMobile()) {
          if (!body.classList.contains('sidenav-open') && !body.classList.contains('sidenav-collapsed')) {
            body.classList.add('sidenav-collapsed');
          }
        } else {
          body.classList.remove('sidenav-open');
          if (!userPinned) {
            body.classList.remove('sidenav-collapsed');
          }
        }
        updateTab();
      }

      syncState();
      window.addEventListener('resize', syncState);

      if (toggler) {
        toggler.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          toggleSidenav();
        });
      }

      if (tab) {
        tab.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          openSidenav(true);
        });
      }

      if (backdrop) {
        backdrop.addEventListener('click', function () { closeSidenav(); });
      }

      document.addEventListener('click', function (event) {
        const clickedInside = sidenav.contains(event.target) ||
          (toggler && toggler.contains(event.target)) ||
          (tab && tab.contains(event.target));
        if (isMobile()) {
          if (body.classList.contains('sidenav-open') && !clickedInside) {
            closeSidenav();
          }
        } else {
          if (!body.classList.contains('sidenav-collapsed') && !clickedInside) {
            closeSidenav(true);
          }
        }
      });

      document.addEventListener('touchstart', function (event) {
        if (!isMobile() || event.touches.length !== 1) { return; }
        touchStartX = event.touches[0].clientX;
      }, { passive: true });

      document.addEventListener('touchend', function (event) {
        if (!isMobile() || touchStartX === null) { return; }
        const touchEndX = event.changedTouches[0].clientX;
        const deltaX = touchEndX - touchStartX;
        if (Math.abs(deltaX) > 60) {
          if (deltaX < 0 && body.classList.contains('sidenav-open')) {
            closeSidenav();
          } else if (deltaX > 0 && body.classList.contains('sidenav-collapsed') && touchStartX < 40) {
            openSidenav(true);
          }
        }
        touchStartX = null;
      }, { passive: true });
    })();
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var body = document.body;
      if (!body) { return; }
      var root = document.documentElement;
      var toggleButton = document.getElementById('theme-toggle-btn');
      var THEME_KEY = 'amantini-theme';

      function currentTheme() {
        return root.classList.contains('theme-dark') ? 'dark' : 'light';
      }

      function updateButton(theme) {
        if (!toggleButton) { return; }
        if (theme === 'dark') {
          toggleButton.innerHTML = '<i class="fas fa-sun"></i><span class="d-none d-md-inline">Tema claro</span>';
          toggleButton.setAttribute('aria-label', 'Ativar tema claro');
        } else {
          toggleButton.innerHTML = '<i class="fas fa-moon"></i><span class="d-none d-md-inline">Tema escuro</span>';
          toggleButton.setAttribute('aria-label', 'Ativar tema escuro');
        }
      }

      function applyTheme(theme) {
        if (theme === 'dark') {
          root.classList.add('theme-dark');
          body.classList.add('theme-dark');
        } else {
          root.classList.remove('theme-dark');
          body.classList.remove('theme-dark');
        }
        updateButton(theme);
      }

      var storedTheme = null;
      try {
        storedTheme = localStorage.getItem(THEME_KEY);
      } catch (err) {
        storedTheme = null;
      }

      var initialTheme = 'light';
      if (root.classList.contains('theme-dark')) {
        initialTheme = 'dark';
      }
      if (storedTheme === 'dark') {
        initialTheme = 'dark';
      }
      if (storedTheme === 'light') {
        initialTheme = 'light';
      }

      applyTheme(initialTheme);

      if (toggleButton) {
        toggleButton.addEventListener('click', function () {
          var nextTheme = currentTheme() === 'dark' ? 'light' : 'dark';
          applyTheme(nextTheme);
          try {
            localStorage.setItem(THEME_KEY, nextTheme);
          } catch (err) {
            // ignore storage errors
          }
        });
      }
    });
  </script>
